name: Feature request
description: Suggest a new tool, option, skill or client integration.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/afurm/rails-agent-kit/blob/main/ROADMAP.md) first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does your agent get wrong or have to guess today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The tool, parameter or output you'd like. Show example output if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to open a PR for this
