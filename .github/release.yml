# Categories for GitHub's auto-generated release notes (gh release create --generate-notes, or the
# "Generate release notes" button). Published notes come from CHANGELOG.md (script/release_notes.rb);
# use the generated list as a checklist of merged PRs and contributors when writing the changelog.
changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: New
      labels: [feature, enhancement]
    - title: Fixed
      labels: [fix, bug]
    - title: Documentation
      labels: [docs, documentation]
    - title: Maintenance
      labels: ["*"]
