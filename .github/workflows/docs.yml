name: Docs

# Builds the docs site in docs/ (Jekyll + Just the Docs) on pull requests that touch it, and deploys it to
# GitHub Pages from main.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: docs
      - id: pages
        uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - name: Build
        run: bundle exec jekyll build --baseurl "${BASE_PATH}"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/rails-agent-kit' }}
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
