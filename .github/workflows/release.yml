name: Release

# Push a vX.Y.Z tag on the release commit to publish the gem to RubyGems.org with trusted publishing
# (OIDC, no API key or OTP) and create the GitHub release from the matching CHANGELOG.md section.
# One-time setup on rubygems.org: see RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish ${{ github.ref_name }}
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Check the tag matches RailsAgentKit::VERSION
        run: |
          version=$(ruby -Ilib -e 'require "rails_agent_kit/version"; print RailsAgentKit::VERSION')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match RailsAgentKit::VERSION ${version}"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: ruby script/release_notes.rb "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
      - name: Build and push the gem (trusted publishing)
        uses: rubygems/release-gem@v1
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
