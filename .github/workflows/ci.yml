name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}${{ matrix.experimental && ' (allowed to fail)' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        experimental: [false]
        include:
          - ruby: head
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/cache@v5
        with:
          path: tmp/corpus/external
          key: corpus-external-${{ hashFiles('test/corpus/external.json') }}
      - run: script/corpus/fetch_external
      - run: bundle exec rake test
        env:
          CORPUS_REQUIRED: "1"
